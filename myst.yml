        - file: 00_python/functions.ipynb
        - file: 00_python/classes.ipynb
        - file: 00_python/modules.ipynb
        - file: 00_python/decorators.ipynb
        - file: 00_python/iterators.ipynb
        - file: 00_python/pyplot.ipynb
        - file: 00_python/misc.ipynb
    - file: 01_analysis/analysis.md
      children:
        - file: 01_analysis/asymptotic_notation.ipynb
        - file: 01_analysis/recursion.ipynb
        - file: 01_analysis/convergence.ipynb
        - file: 01_analysis/average_case.ipynb
    - file: 02_linear_algebra/linear_algebra.md
      children:
        - file: 02_linear_algebra/memory.ipynb
        - file: 02_linear_algebra/numpy_scipy_linalg.ipynb
